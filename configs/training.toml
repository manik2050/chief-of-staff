base_model = "Qwen/Qwen2.5-1.5B-Instruct"
adapter_version = "v1"
output_dir = "artifacts/adapters/v1"
data_dir = "data/processed"

r = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = "all-linear"

num_train_epochs = 2
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 8
learning_rate = 2e-4
max_length = 2048
packing = true
logging_steps = 10
eval_steps = 50
save_steps = 50
save_total_limit = 2
