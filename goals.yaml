# goals.yaml — prioritization truth.
#
# This file outranks urgency, seniority, and inbox age. Every task, meeting, and inbound
# message is scored against it. If something advances no goal here, it is "unaligned" and
# never displaces P0 or P1 work.
#
# Edit this yourself. Your Chief of Staff may propose diffs but should not rewrite it.
#
# The shipped set is a generic TPM / operator — a public personal build, protected deep
# work, a weekly status rhythm, a small relationship set, health. It is fiction. It is not
# anyone's employer plan. Replace it.
#
# Schema
#   id            short kebab-case handle, referenced by my-tasks.yaml
#   title         one line, outcome-shaped ("ship X", not "work on X")
#   priority      P0 | P1 | P2 | P3   (see CLAUDE.md §6)
#   horizon       quarter | year | ongoing
#   status        active | paused | done | dropped
#   why           the consequence of not doing it — this is what makes triage possible
#   metric        how you know it is done; a number and a date where possible
#   target_date   YYYY-MM-DD or null
#   stakeholders  names as they appear in contacts/
#   keywords      terms used to match inbound items to this goal
#   review        when you next re-evaluate whether this still deserves its priority

version: 1
owner: "{{NAME}}"
updated: "2026-09-20"
review_cadence: weekly

goals:
  - id: public-build
    title: "Keep the personal public build shipping every week"
    priority: P0
    horizon: ongoing
    status: active
    why: >
      A public repo that does not move is a stalled narrative. Weekly visible progress —
      a commit on main, a playbook, a test — is how the operating system stays real.
    metric: "At least one meaningful commit on the flagship public repo each week"
    target_date: null
    stakeholders: ["Jordan Rivera"]
    keywords: ["github", "commit", "readme", "install", "dispatch", "chief of staff", "public"]
    review: "2026-09-27"

  - id: deep-work
    title: "Protect deep work so the build actually happens"
    priority: P0
    horizon: ongoing
    status: active
    why: >
      Meetings expand to fill the calendar. Without hard blocks the public build is the
      first thing that slips, and it slips silently.
    metric: "Two 3-hour deep-work blocks kept each week; no P2+ work scheduled into them"
    target_date: null
    stakeholders: []
    keywords: ["calendar", "focus", "deep work", "hold", "reschedule", "protected"]
    review: "2026-09-27"

  - id: weekly-status
    title: "Run a weekly status rhythm you could hand to anyone"
    priority: P1
    horizon: year
    status: active
    why: >
      If the week cannot be summarized, it was not directed. The status file is the
      forcing function: goals, dispatches, blockers, one decision needed.
    metric: "Four consecutive Fridays with a status file in briefings/"
    target_date: null
    stakeholders: ["Jordan Rivera"]
    keywords: ["weekly status", "status", "review", "retro", "operating rhythm", "tldr"]
    review: "2026-10-04"

  - id: relationships
    title: "Keep a small set of working relationships from going cold"
    priority: P2
    horizon: ongoing
    status: active
    why: >
      The useful people are not in the inbox every day. Cadence is how you notice decay
      before it becomes a reconnection email with no hook.
    metric: "Zero inner-tier contacts overdue; at most three working-tier overdue at a time"
    target_date: null
    stakeholders: ["Jordan Rivera"]
    keywords: ["intro", "catch up", "coffee", "nudge", "relationship", "network"]
    review: "2026-10-11"

  - id: health
    title: "Protect sleep and training through the busy months"
    priority: P2
    horizon: ongoing
    status: active
    why: >
      Depleted decisions are the expensive ones. Training and a hard stop in the evening
      are cheaper than the week you lose repairing a tired call.
    metric: "Four training sessions a week; no calls before 09:00"
    target_date: null
    stakeholders: []
    keywords: ["gym", "training", "doctor", "travel", "sleep"]
    review: "2026-10-11"

  - id: writing
    title: "Publish occasionally on how you operate"
    priority: P3
    horizon: year
    status: paused
    why: >
      Compounds inbound over years, matters zero this month. Parked until the weekly
      shipping habit is boring.
    metric: "One short essay per month once unpaused"
    target_date: null
    stakeholders: []
    keywords: ["essay", "blog", "newsletter", "podcast", "speaking"]
    review: "2026-12-01"

# Anything matching none of the keyword sets above is unaligned. Unaligned work is allowed
# but tracked: if it exceeds a third of the week, the Chief of Staff says so in the briefing.
unaligned_policy:
  weekly_budget_pct: 33
  action_when_exceeded: "flag in next /gm briefing with the three largest consumers"
