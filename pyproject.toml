[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-of-staff"
version = "0.1.0"
description = "Fine-tune a small LLM to turn startup briefs into grounded funding-pitch copy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manik Gupta" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "requests>=2.32",
  "pypdf>=5.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
training = [
  "torch",
  "transformers",
  "datasets",
  "accelerate",
  "peft",
  "trl",
  "bitsandbytes",
  "sentencepiece",
  "safetensors",
]
ocr = ["docling"]
serve-vllm = ["vllm"]

[project.scripts]
chief-of-staff = "chief_of_staff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chief_of_staff = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
