# my-tasks.yaml — open commitments.
#
# This is the Chief of Staff's working file. It writes here during /triage and /my-tasks.
# Every task must reference a goal id from goals.yaml, or be explicitly marked unaligned.
#
# Schema
#   id            t-NNN, never reused
#   title         the outcome, phrased as a verb
#   goal          goal id from goals.yaml, or "unaligned"
#   status        next | in-progress | waiting | blocked | done | dropped
#   tier          1 | 2 | 3  (triage tier at time of capture — see CLAUDE.md §8)
#   next_action   the single physical next step; if you cannot name it, the task is not ready
#   due           YYYY-MM-DD or null
#   waiting_on    person's name (required when status is waiting)
#   source        where it came from: email, meeting, slack, self, briefing
#   created       YYYY-MM-DD
#   touched       YYYY-MM-DD — updated whenever status or next_action changes
#   notes         optional, one line
#
# Staleness rules the Chief of Staff enforces:
#   - status: waiting  untouched 5+ days   -> propose a nudge
#   - status: next     untouched 14+ days  -> propose dropping it
#   - tier 2 item aged 14+ days            -> force it to tier 1 or drop it

